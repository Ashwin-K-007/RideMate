<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideMate — Campus Commute Simplified</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-600 text-white p-2 rounded-xl">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">Ride<span class="text-emerald-600">Mate</span></span>
                <span class="hidden sm:inline-block text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full ml-2">Campus Verified</span>
            </div>
            <button onclick="toggleModal('postModal', true)" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm flex items-center space-x-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Offer a Ride</span>
            </button>
        </div>
    </header>

    <!-- Hero Section & Search -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
        <div class="text-center max-w-2xl mx-auto mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
                Share rides. Save fuel. <br/><span class="text-emerald-600 underline decoration-emerald-300 decoration-wavy">Commute together.</span>
            </h1>
            <p class="text-slate-500 text-sm sm:text-base">The peer-to-peer campus ride-sharing network for students. Find bike-pools and car-pools heading your way.</p>
        </div>

        <!-- Search Bar -->
        <div class="glass-panel p-3 rounded-2xl shadow-sm mb-10 max-w-3xl mx-auto border border-slate-200">
            <form id="searchForm" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <div class="relative flex items-center">
                    <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3"></i>
                    <input type="text" id="searchOrigin" placeholder="Leaving from... (e.g. Bus Stand)" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="relative flex items-center">
                    <i data-lucide="navigation" class="w-4 h-4 text-slate-400 absolute left-3"></i>
                    <input type="text" id="searchDest" placeholder="Going to... (e.g. Campus Gate)" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center space-x-2 shadow-sm">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <span>Find Rides</span>
                </button>
            </form>
        </div>

        <!-- Rides Grid -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="list-filter" class="w-5 h-5 text-emerald-600"></i>
                Available Commutes
            </h2>
            <button onclick="fetchRides()" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 flex items-center gap-1">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Feed
            </button>
        </div>

        <div id="ridesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <!-- Post Ride Modal -->
    <div id="postModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-800">Offer a Shared Ride</h3>
                <button onclick="toggleModal('postModal', false)" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="postRideForm" class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Your Name</label>
                    <input type="text" required id="postName" placeholder="e.g. Aravind K." class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number (For passenger contact)</label>
                    <input type="text" required id="postPhone" placeholder="+91 98765 43210" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Vehicle Type</label>
                        <select id="postType" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Bike">Bike-Pool 🏍️</option>
                            <option value="Car">Car-Pool 🚗</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Vehicle Model</label>
                        <input type="text" required id="postModel" placeholder="e.g. Unicorn 150" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Leaving From</label>
                        <input type="text" required id="postOrigin" placeholder="e.g. Pollachi" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Going To</label>
                        <input type="text" required id="postDest" placeholder="e.g. College Campus" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Departure Time</label>
                        <input type="text" required id="postTime" placeholder="08:30 AM" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Seats Left</label>
                        <input type="number" required min="1" max="6" id="postSeats" value="1" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Price/Seat (₹)</label>
                        <input type="number" required min="0" id="postPrice" value="20" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <button type="submit" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-md">
                    Publish Commute
                </button>
            </form>
        </div>
    </div>

    <!-- Javascript Logic -->
    <script>
        lucide.createIcons();

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        async function fetchRides(origin = '', dest = '') {
            const grid = document.getElementById('ridesGrid');
            grid.innerHTML = '<p class="col-span-full text-center py-10 text-slate-400">Loading available commutes...</p>';
            
            try {
                const res = await fetch(`/api/rides?origin=${encodeURIComponent(origin)}&dest=${encodeURIComponent(dest)}`);
                const rides = await res.json();
                
                grid.innerHTML = '';
                if (rides.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
                            <i data-lucide="compass" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                            <p class="text-slate-600 font-semibold">No rides found on this route.</p>
                            <p class="text-slate-400 text-xs mt-1">Be the first to offer a ride and help a fellow student out!</p>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                rides.forEach(ride => {
                    const isBike = ride.vehicle_type === 'Bike';
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-2xl border border-slate-200/80 hover:border-emerald-300 transition-all duration-200 shadow-sm hover:shadow-md flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center space-x-2">
                                    <span class="p-2 rounded-xl ${isBike ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'} font-bold text-xs flex items-center gap-1">
                                        <i data-lucide="${isBike ? 'bike' : 'car'}" class="w-3.5 h-3.5"></i>
                                        ${ride.vehicle_type}-Pool
                                    </span>
                                    <span class="text-xs text-slate-400 font-medium">${ride.vehicle_model}</span>
                                </div>
                                <span class="text-lg font-extrabold text-slate-900">₹${ride.price_per_seat}<span class="text-xs font-normal text-slate-400">/seat</span></span>
                            </div>

                            <div class="space-y-2 my-4">
                                <div class="flex items-center space-x-2 text-sm font-semibold text-slate-800">
                                    <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                                    <span class="truncate">${ride.origin}</span>
                                </div>
                                <div class="border-l-2 border-dashed border-slate-200 ml-1 pl-3 py-0.5 text-xs text-slate-400 flex items-center justify-between">
                                    <span>Departs at ${ride.ride_time}</span>
                                </div>
                                <div class="flex items-center space-x-2 text-sm font-semibold text-slate-800">
                                    <div class="w-2 h-2 rounded-full bg-indigo-500"></div>
                                    <span class="truncate">${ride.destination}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between mt-2">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center font-bold text-xs text-slate-600">
                                    ${ride.driver_name.charAt(0)}
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-slate-700 leading-tight">${ride.driver_name}</p>
                                    <p class="text-[10px] text-emerald-600 font-semibold">${ride.seats_available} seat(s) left</p>
                                </div>
                            </div>
                            <button onclick="bookSeat(${ride.id}, '${ride.phone}')" class="bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white border border-emerald-200 hover:border-transparent px-3 py-1.5 rounded-xl text-xs font-bold transition">
                                Request Seat
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                lucide.createIcons();
            } catch (err) {
                grid.innerHTML = '<p class="col-span-full text-center py-10 text-red-500 text-sm">Failed to connect to backend server.</p>';
            }
        }

        async function bookSeat(id, phone) {
            if(!confirm(`Request seat for this ride? You will be prompted to contact the driver at ${phone} after confirmation.`)) return;
            
            const res = await fetch(`/api/book/${id}`, { method: 'POST' });
            const data = await res.json();
            
            if(res.ok) {
                alert(`✅ Seat Reserved! Please WhatsApp or call the driver at ${phone} to coordinate the pickup point.`);
                fetchRides();
            } else {
                alert(`❌ Could not book: ${data.message}`);
            }
        }

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const origin = document.getElementById('searchOrigin').value;
            const dest = document.getElementById('searchDest').value;
            fetchRides(origin, dest);
        });

        document.getElementById('postRideForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                driver_name: document.getElementById('postName').value,
                phone: document.getElementById('postPhone').value,
                vehicle_type: document.getElementById('postType').value,
                vehicle_model: document.getElementById('postModel').value,
                origin: document.getElementById('postOrigin').value,
                destination: document.getElementById('postDest').value,
                ride_time: document.getElementById('postTime').value,
                seats_available: document.getElementById('postSeats').value,
                price_per_seat: document.getElementById('postPrice').value,
            };

            const res = await fetch('/api/rides', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                toggleModal('postModal', false);
                document.getElementById('postRideForm').reset();
                fetchRides();
            } else {
                alert("Failed to publish ride. Please check inputs.");
            }
        });

        // Initial load
        fetchRides();
    </script>
</body>
</html>
